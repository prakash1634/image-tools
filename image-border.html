<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Border - ImageTools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb}
header{background:#111827;color:white;text-align:center;padding:18px}
.container{width:94%;max-width:850px;margin:20px auto}.card{background:white;padding:18px;border-radius:16px}
.upload{display:block;border:2px dashed #999;padding:22px;text-align:center;border-radius:12px}#file{display:none}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.controls label{font-size:12px;font-weight:bold}
input{width:100%;padding:9px;margin-top:5px}.preview{text-align:center;margin:18px}.preview canvas{max-width:100%;max-height:500px}
button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:9px;background:#16a34a;color:white;font-weight:bold}
.status{margin-top:12px;padding:10px;background:#f3f4f6;font-size:12px}
</style>
</head>
<body>
<header><h1>Image Border</h1><p>Add a custom border to your image</p></header>
<div class="container"><div class="card">
<label class="upload" for="file"><b>📷 Choose Image</b></label><input id="file" type="file" accept="image/*">
<div class="controls">
<label>Border Width<input id="width" type="range" min="1" max="100" value="15"></label>
<label>Border Color<input id="color" type="color" value="#000000"></label>
</div>
<div class="preview"><canvas id="canvas"></canvas></div>
<button id="download" disabled>Download Image</button>
<div class="status" id="status">Choose an image to start.</div>
</div></div>
<script>
const f=document.getElementById("file"),c=document.getElementById("canvas"),x=c.getContext("2d"),w=document.getElementById("width"),co=document.getElementById("color"),d=document.getElementById("download"),s=document.getElementById("status");let im=new Image(),loaded=false;
f.onchange=()=>{im.onload=()=>{loaded=true;draw();d.disabled=false;s.textContent="✅ Image loaded."};im.src=URL.createObjectURL(f.files[0])};
function draw(){if(!loaded)return;let b=+w.value;c.width=im.naturalWidth+b*2;c.height=im.naturalHeight+b*2;x.fillStyle=co.value;x.fillRect(0,0,c.width,c.height);x.drawImage(im,b,b)}
w.oninput=draw;co.oninput=draw;
d.onclick=()=>c.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="bordered-image.png";a.click()});
</script>
</body>
</html>
