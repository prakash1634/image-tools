<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Background Remover - ImageTools</title>

  <meta name="description"
        content="Remove image backgrounds automatically with AI and download transparent PNG images.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 17px 12px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 22px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 17px;
      box-shadow: 0 5px 22px rgba(0,0,0,0.08);
    }

    .upload {
      border: 2px dashed #9ca3af;
      border-radius: 14px;
      padding: 25px 12px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    .upload strong {
      display: block;
      font-size: 17px;
      margin-bottom: 7px;
    }

    .upload span {
      font-size: 13px;
      color: #666;
    }

    #fileInput {
      display: none;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .preview-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .preview {
      width: 100%;
      min-height: 230px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
      background: #f1f1f1;
    }

    .checker {
      background-color: white;
      background-image:
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 22px 22px;
      background-position:
        0 0,
        0 11px,
        11px -11px,
        -11px 0;
    }

    .preview img {
      max-width: 100%;
      max-height: 500px;
      display: block;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 17px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #removeBtn {
      background: #111827;
      color: white;
    }

    #downloadBtn {
      background: #16a34a;
      color: white;
      display: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      font-size: 13px;
      line-height: 1.5;
    }

    .progress {
      display: none;
      margin-top: 13px;
    }

    .bar {
      width: 100%;
      height: 9px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: #111827;
      transition: width 0.2s;
    }

    .progress-text {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {
      .preview-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 15px;
      }

      .preview {
        min-height: 210px;
      }

      header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AI Background Remover</h1>
  <p>Remove image background automatically with AI</p>
</header>

<div class="container">

  <div class="card">

    <label class="upload" for="fileInput">
      <strong>📷 Choose an Image</strong>
      <span>JPG, JPEG, PNG or WebP</span>
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="preview-grid">

      <div>
        <div class="preview-title">
          Original Image
        </div>

        <div class="preview">
          <img
            id="originalPreview"
            class="hidden"
            alt="Original image"
          >
        </div>
      </div>


      <div>
        <div class="preview-title">
          Background Removed
        </div>

        <div class="preview checker">

          <img
            id="resultPreview"
            class="hidden"
            alt="Background removed image"
          >

        </div>
      </div>

    </div>


    <div class="buttons">

      <button id="removeBtn" disabled>
        Remove Background
      </button>

      <button id="downloadBtn">
        Download PNG
      </button>

    </div>


    <div class="progress" id="progressBox">

      <div class="bar">
        <div class="fill" id="progressFill"></div>
      </div>

      <div class="progress-text" id="progressText">
        Starting...
      </div>

    </div>


    <div class="status" id="status">
      Choose an image to start.
    </div>


    <div class="note">
      <strong>Note:</strong>
      The first processing may take some time because the AI model
      needs to load in your browser. After loading, the model can be
      cached by the browser.
    </div>

  </div>

</div>


<script type="module">

  const fileInput =
    document.getElementById("fileInput");

  const originalPreview =
    document.getElementById("originalPreview");

  const resultPreview =
    document.getElementById("resultPreview");

  const removeBtn =
    document.getElementById("removeBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const status =
    document.getElementById("status");

  const progressBox =
    document.getElementById("progressBox");

  const progressFill =
    document.getElementById("progressFill");

  const progressText =
    document.getElementById("progressText");


  let selectedFile = null;

  let resultUrl = null;

  let removeBackground = null;


  /*
    Load AI library only when user actually
    presses Remove Background.
  */

  async function loadAI() {

    if (removeBackground) {
      return removeBackground;
    }

    status.textContent =
      "Loading AI engine...";

    const module = await import(
      "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
    );

    removeBackground =
      module.default ||
      module.removeBackground;

    if (!removeBackground) {
      throw new Error(
        "AI engine could not be loaded."
      );
    }

    return removeBackground;
  }


  /*
    Select image
  */

  fileInput.addEventListener(
    "change",
    function() {

      const file =
        fileInput.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;


      if (resultUrl) {

        URL.revokeObjectURL(
          resultUrl
        );

        resultUrl = null;
      }


      resultPreview.removeAttribute(
        "src"
      );

      resultPreview.classList.add(
        "hidden"
      );


      downloadBtn.style.display =
        "none";


      const url =
        URL.createObjectURL(file);


      originalPreview.src =
        url;

      originalPreview.classList.remove(
        "hidden"
      );


      removeBtn.disabled =
        false;


      status.textContent =
        "Image selected. Tap Remove Background.";

    }
  );


  /*
    Remove Background
  */

  removeBtn.addEventListener(
    "click",
    async function() {

      if (!selectedFile) {
        return;
      }


      removeBtn.disabled =
        true;

      downloadBtn.style.display =
        "none";

      progressBox.style.display =
        "block";


      progressFill.style.width =
        "0%";


      progressText.textContent =
        "Starting AI...";


      status.textContent =
        "Preparing image...";


      try {

        const ai =
          await loadAI();


        status.textContent =
          "AI is removing the background...";


        /*
          FAST MOBILE MODEL

          isnet_quint8 is much smaller than
          the normal isnet model.

          CPU gives better compatibility
          on Android phones.
        */

        const config = {

          publicPath:
            "https://staticimgly.com/@imgly/background-removal-data/1.7.0/dist/",

          device:
            "cpu",

          model:
            "isnet_quint8",

          proxyToWorker:
            true,

          output: {

            format:
              "image/png",

            type:
              "foreground",

            quality:
              1

          },

          progress:
            function(
              key,
              current,
              total
            ) {

              if (
                total &&
                total > 0
              ) {

                const percent =
                  Math.round(
                    (current / total) * 100
                  );


                progressFill.style.width =
                  percent + "%";


                progressText.textContent =
                  "Loading AI: " +
                  percent +
                  "%";

              }

            }

        };


        /*
          Run AI
        */

        const result =
          await ai(
            selectedFile,
            config
          );


        progressFill.style.width =
          "100%";


        progressText.textContent =
          "Background removed successfully.";


        /*
          Show result
        */

        resultUrl =
          URL.createObjectURL(
            result
          );


        resultPreview.src =
          resultUrl;


        resultPreview.classList.remove(
          "hidden"
        );


        /*
          Download
        */

        downloadBtn.style.display =
          "block";


        downloadBtn.onclick =
          function() {

            const link =
              document.createElement(
                "a"
              );


            link.href =
              resultUrl;


            link.download =
              "background-removed.png";


            document.body.appendChild(
              link
            );


            link.click();


            link.remove();

          };


        status.innerHTML =
          "<strong>✅ Done!</strong><br>" +
          "Background removed. Transparent PNG is ready.";


      }
      catch (error) {

        console.error(
          "Background remover error:",
          error
        );


        status.innerHTML =
          "<strong>❌ Error</strong><br>" +
          (
            error.message ||
            "Unable to remove background. Please try again."
          );


        progressText.textContent =
          "Processing failed.";


        progressFill.style.width =
          "0%";

      }


      removeBtn.disabled =
        false;

    }
  );

</script>

</body>
</html>
