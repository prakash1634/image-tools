<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image to Base64 - ImageTools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb;color:#222}
header{background:#111827;color:white;text-align:center;padding:18px}header h1{margin:0;font-size:23px}header p{font-size:12px}
.container{width:94%;max-width:850px;margin:20px auto}.card{background:white;padding:18px;border-radius:16px;box-shadow:0 5px 20px #0001}
.upload{display:block;border:2px dashed #9ca3af;border-radius:12px;padding:22px;text-align:center;cursor:pointer}
#file{display:none}img{max-width:100%;max-height:300px;margin-top:18px;display:none}
textarea{width:100%;height:180px;margin-top:15px;padding:10px;border:1px solid #ddd;border-radius:8px;font-family:monospace}
button{width:100%;border:0;border-radius:9px;padding:13px;margin-top:10px;background:#111827;color:white;font-weight:bold}
.status{margin-top:12px;background:#f3f4f6;padding:10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<header><h1>Image to Base64</h1><p>Convert image to Base64 code</p></header>
<div class="container"><div class="card">
<label class="upload" for="file"><b>📷 Choose Image</b><br><small>JPG, PNG or WebP</small></label>
<input id="file" type="file" accept="image/*">
<img id="preview">
<textarea id="output" placeholder="Base64 code will appear here..." readonly></textarea>
<button id="copy">Copy Base64</button>
<div class="status" id="status">Choose an image to start.</div>
</div></div>
<script>
const file=document.getElementById("file"),preview=document.getElementById("preview"),output=document.getElementById("output"),copy=document.getElementById("copy"),status=document.getElementById("status");
file.onchange=()=>{let f=file.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display="block";let r=new FileReader();r.onload=()=>{output.value=r.result;status.textContent="✅ Base64 created successfully."};r.readAsDataURL(f)};
copy.onclick=async()=>{if(!output.value)return;await navigator.clipboard.writeText(output.value);copy.textContent="✅ Copied!";setTimeout(()=>copy.textContent="Copy Base64",1500)};
</script>
</body>
</html>
