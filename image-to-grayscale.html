<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image to Grayscale - ImageTools</title>

  <meta name="description"
        content="Convert images to black and white grayscale online for free.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 18px 12px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: .85;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .upload {
      display: block;
      border: 2px dashed #9ca3af;
      border-radius: 12px;
      padding: 22px 10px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    .upload strong {
      display: block;
      margin-bottom: 6px;
    }

    .upload span {
      font-size: 12px;
      color: #666;
    }

    #fileInput {
      display: none;
    }

    .preview {
      margin-top: 18px;
      width: 100%;
      min-height: 250px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 600px;
      display: block;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #downloadBtn {
      background: #111827;
      color: white;
    }

    #resetBtn {
      background: #e5e7eb;
      color: #222;
    }

    button:disabled {
      opacity: .5;
    }

    .status {
      margin-top: 12px;
      background: #f3f4f6;
      border-radius: 9px;
      padding: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>Image to Grayscale</h1>
  <p>Convert your image to black and white</p>
</header>

<div class="container">

  <div class="card">

    <label class="upload" for="fileInput">
      <strong>📷 Choose an Image</strong>
      <span>JPG, JPEG, PNG or WebP</span>
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="preview">
      <canvas id="canvas"></canvas>
    </div>

    <div class="buttons">

      <button id="downloadBtn" disabled>
        Download Grayscale
      </button>

      <button id="resetBtn">
        Reset
      </button>

    </div>

    <div class="status" id="status">
      Choose an image to start.
    </div>

  </div>

</div>

<script>

  const fileInput =
    document.getElementById("fileInput");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const resetBtn =
    document.getElementById("resetBtn");

  const status =
    document.getElementById("status");


  let imageLoaded = false;


  fileInput.addEventListener(
    "change",
    function() {

      const file =
        fileInput.files[0];

      if (!file) {
        return;
      }


      const url =
        URL.createObjectURL(file);


      const image =
        new Image();


      image.onload =
        function() {

          canvas.width =
            image.naturalWidth;

          canvas.height =
            image.naturalHeight;


          ctx.drawImage(
            image,
            0,
            0
          );


          const imageData =
            ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height
            );


          const data =
            imageData.data;


          for (
            let i = 0;
            i < data.length;
            i += 4
          ) {

            const r =
              data[i];

            const g =
              data[i + 1];

            const b =
              data[i + 2];


            const gray =
              Math.round(
                0.299 * r +
                0.587 * g +
                0.114 * b
              );


            data[i] =
              gray;

            data[i + 1] =
              gray;

            data[i + 2] =
              gray;

          }


          ctx.putImageData(
            imageData,
            0,
            0
          );


          imageLoaded =
            true;


          downloadBtn.disabled =
            false;


          status.innerHTML =
            "<strong>✅ Done!</strong><br>" +
            "Image converted to grayscale.";

          
          URL.revokeObjectURL(url);

        };


      image.onerror =
        function() {

          status.textContent =
            "❌ Could not load this image.";

          URL.revokeObjectURL(url);

        };


      image.src =
        url;

    }
  );


  downloadBtn.addEventListener(
    "click",
    function() {

      if (!imageLoaded) {
        return;
      }


      canvas.toBlob(
        function(blob) {

          if (!blob) {
            return;
          }


          const url =
            URL.createObjectURL(blob);


          const link =
            document.createElement("a");


          link.href =
            url;

          link.download =
            "grayscale-image.png";


          document.body.appendChild(
            link
          );

          link.click();

          link.remove();


          URL.revokeObjectURL(url);


          status.textContent =
            "✅ Grayscale image downloaded.";

        },
        "image/png"
      );

    }
  );


  resetBtn.addEventListener(
    "click",
    function() {

      fileInput.value =
        "";

      imageLoaded =
        false;


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      downloadBtn.disabled =
        true;


      status.textContent =
        "Choose an image to start.";

    }
  );

</script>

</body>
</html>
