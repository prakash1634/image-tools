<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rounded Image - ImageTools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb}header{background:#111827;color:white;text-align:center;padding:18px}
.container{width:94%;max-width:850px;margin:20px auto}.card{background:white;padding:18px;border-radius:16px}
.upload{display:block;border:2px dashed #999;padding:22px;text-align:center;border-radius:12px}#file{display:none}
input[type=range]{width:100%;margin:15px 0}.preview{text-align:center}.preview canvas{max-width:100%;max-height:500px}
button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:9px;background:#16a34a;color:white;font-weight:bold}.status{margin-top:12px;padding:10px;background:#f3f4f6;font-size:12px}
</style>
</head>
<body>
<header><h1>Rounded Corner Image</h1><p>Create images with rounded corners</p></header>
<div class="container"><div class="card">
<label class="upload" for="file"><b>📷 Choose Image</b></label><input id="file" type="file" accept="image/*">
<label>Corner Radius: <span id="val">30</span>px</label><input id="range" type="range" min="0" max="200" value="30">
<div class="preview"><canvas id="canvas"></canvas></div>
<button id="download" disabled>Download PNG</button><div class="status" id="status">Choose an image to start.</div>
</div></div>
<script>
const f=document.getElementById("file"),c=document.getElementById("canvas"),x=c.getContext("2d"),r=document.getElementById("range"),v=document.getElementById("val"),d=document.getElementById("download"),s=document.getElementById("status");let im=new Image(),ok=false;
f.onchange=()=>{im.onload=()=>{ok=true;draw();d.disabled=false;s.textContent="✅ Image loaded."};im.src=URL.createObjectURL(f.files[0])};
function draw(){if(!ok)return;let q=+r.value;c.width=im.naturalWidth;c.height=im.naturalHeight;x.clearRect(0,0,c.width,c.height);x.beginPath();x.roundRect(0,0,c.width,c.height,q);x.clip();x.drawImage(im,0,0);v.textContent=q}
r.oninput=draw;d.onclick=()=>c.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rounded-image.png";a.click()},"image/png");
</script>
</body>
</html>
