<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Pixelate - ImageTools</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fb}header{background:#111827;color:white;text-align:center;padding:18px}
.container{width:94%;max-width:850px;margin:20px auto}.card{background:white;padding:18px;border-radius:16px}
.upload{display:block;border:2px dashed #999;padding:22px;text-align:center;border-radius:12px;cursor:pointer}#file{display:none}
input[type=range]{width:100%;margin:12px 0}.preview{text-align:center;margin:15px}.preview canvas{max-width:100%;max-height:500px}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#16a34a;color:white;font-weight:bold}.status{margin-top:12px;padding:10px;background:#f3f4f6;font-size:12px}
</style>
</head>
<body>
<header><h1>Image Pixelate</h1><p>Pixelate your image for privacy</p></header>
<div class="container"><div class="card">
<label class="upload" for="file"><b>📷 Choose Image</b></label>
<input id="file" type="file" accept="image/*">
<label>Pixel Size: <span id="val">12</span></label>
<input id="range" type="range" min="2" max="40" value="12">
<div class="preview"><canvas id="canvas"></canvas></div>
<button id="download" disabled>Download Pixelated Image</button>
<div class="status" id="status">Choose an image to start.</div>
</div></div>
<script>
const f=document.getElementById("file"),r=document.getElementById("range"),v=document.getElementById("val"),c=document.getElementById("canvas"),x=c.getContext("2d"),d=document.getElementById("download"),s=document.getElementById("status");let im=new Image(),ok=false;
f.onchange=()=>{im.onload=()=>{ok=true;draw();d.disabled=false;s.textContent="✅ Image loaded. Adjust pixel size."};im.src=URL.createObjectURL(f.files[0])};
r.oninput=draw;
function draw(){if(!ok)return;let size=+r.value;v.textContent=size;let w=im.naturalWidth,h=im.naturalHeight;c.width=w;c.height=h;let smallW=Math.max(1,Math.ceil(w/size)),smallH=Math.max(1,Math.ceil(h/size)),tmp=document.createElement("canvas");tmp.width=smallW;tmp.height=smallH;let tx=tmp.getContext("2d");tx.drawImage(im,0,0,smallW,smallH);x.imageSmoothingEnabled=false;x.drawImage(tmp,0,0,smallW,smallH,0,0,w,h)}
d.onclick=()=>c.toBlob(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pixelated-image.png";a.click()});
</script>
</body>
</html>
