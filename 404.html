<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | ImageTools</title>

  <meta name="description" content="The page you are looking for could not be found on ImageTools.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header h1 span {
      color: #22c55e;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      text-align: center;
    }

    .box {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 40px 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .error {
      font-size: 64px;
      font-weight: bold;
      margin: 0 0 10px;
      color: #111827;
    }

    h2 {
      margin: 0 0 10px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.9;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 18px 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Image<span>Tools</span></h1>
  </header>

  <main>
    <div class="box">
      <div class="error">404</div>
      <h2>Page Not Found</h2>
      <p>
        Sorry, the page you are looking for does not exist
        or may have been moved.
      </p>

      <a href="/image-tools/">Go to Homepage</a>
    </div>
  </main>

  <footer>
    © 2026 ImageTools. All rights reserved.
  </footer>

</body>
</html>
